services:
  mongodb:
    image: mongo:7
    container_name: phony-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-phony}
    ports:
      # Bind to loopback only so host-side scripts (reconciliation, backfills,
      # mongosh) can reach this DB without going through the container. Port
      # 27018 avoids any conflict with a default mongo on the host.
      - "127.0.0.1:27018:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - voice-network
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  voice-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phony-server
    restart: unless-stopped
    ports:
      - "3004:3004"
    # Map host.docker.internal to the host so outbound webhook dispatches
    # (e.g. to ATC at host:3030) can reach services bound on the host network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /mnt/db:/mnt/db:ro
      # MMS media marked "permanent" must survive image rebuilds — lost ID
      # photos on 2026-07-30 when this lived in the container's own /tmp
      - phony_media:/tmp/phony-media
    environment:
      # Server configuration
      PORT: 3004
      PUBLIC_URL: ${PUBLIC_URL:-https://phony.pushbuild.com}

      # Twilio credentials
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_NUMBER: ${TWILIO_NUMBER}

      # ElevenLabs credentials
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_DEFAULT_AGENT_ID: ${ELEVENLABS_DEFAULT_AGENT_ID:-}
      ELEVENLABS_DEFAULT_VOICE_ID: ${ELEVENLABS_DEFAULT_VOICE_ID:-}
      # Native integration (Phase 2 hybrid path)
      ELEVENLABS_AGENT_PHONE_NUMBER_ID: ${ELEVENLABS_AGENT_PHONE_NUMBER_ID:-}
      ELEVENLABS_POSTCALL_WEBHOOK_SECRET: ${ELEVENLABS_POSTCALL_WEBHOOK_SECRET:-}

      # API Secret
      API_SECRET: ${API_SECRET}

      # MongoDB connection (uses phony DB where existing data lives; legacy
      # MONGODB_DATABASE in .env may say voice-calls but the actual data is
      # in the phony database).
      MONGODB_URI: mongodb://${MONGODB_USERNAME}:${MONGODB_PASSWORD}@mongodb:27017/${MONGODB_DATABASE:-phony}?authSource=admin

      # SMS whitelist
      SMS_ENABLED_NUMBERS: ${SMS_ENABLED_NUMBERS:-+18575550111}

      # Twilio Messaging Service (optional - auto-created if not set)
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}

      # Optional settings
      RECORD_CALLS: ${RECORD_CALLS:-false}

      # Hard auto-hangup ceilings (constants.ts defaults are 600/1800).
      # Outgoing raised to 1200s on 2026-08-27: the ElevenLabs agent's
      # turn_timeout is now -1, so it waits indefinitely rather than filling
      # silence, and a call spent on hold or on a slow lookup runs much longer.
      # A Pyle call had already reached 532s against the old 600s cap, and the
      # cap fires as a bare Twilio endCall — no warning to either party, mid
      # sentence. Approved by Ben.
      MAX_OUTGOING_CALL_DURATION: ${MAX_OUTGOING_CALL_DURATION:-1200}
      MAX_INCOMING_CALL_DURATION: ${MAX_INCOMING_CALL_DURATION:-1800}

      # Webhook health sweep — reports broken configs to the ATC broker
      # via POST /messages (out-of-band from the webhook dispatcher).
      ATC_BROKER_URL: ${ATC_BROKER_URL:-http://host.docker.internal:3030}
      WEBHOOK_HEALTH_SWEEP_INTERVAL_MS: ${WEBHOOK_HEALTH_SWEEP_INTERVAL_MS:-21600000}
    tty: true
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - voice-network
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3004/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  voice-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  phony_media:
    driver: local
